<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PSC Logo</title>
  <desc id="desc">A bold, angular, connected PSC monogram in black on a transparent background.</desc>
  <g fill="#111111" stroke="#111111" stroke-linejoin="miter" stroke-linecap="square">
    <!-- P: geometric, forward-leaning stem and bowl -->
    <path d="M92 332 L145 76 L386 76 C470 76 500 125 476 176 C457 216 421 235 365 235 L227 235 L207 332 Z
             M247 177 L356 177 C379 177 391 166 397 151 C402 138 394 128 373 128 L257 128 Z" fill-rule="evenodd"/>
    <!-- S: long, interlocking ribbon-like letter -->
    <path d="M531 76 L824 76 L772 128 L594 128 L553 169 L700 169 C779 169 818 202 804 250 C790 300 746 332 675 332 L401 332 L463 281 L656 281 C680 281 693 272 698 257 C701 247 694 240 674 240 L535 240 C467 240 432 209 446 165 C460 121 492 76 531 76 Z"/>
    <!-- C: open angular shape, balanced with the P and S -->
    <path d="M879 76 L1112 76 L1061 128 L914 128 C888 128 873 145 868 168 L855 229 C850 254 864 281 894 281 L1054 281 L1107 332 L872 332 C805 332 770 285 783 224 L800 155 C812 106 841 76 879 76 Z"/>
  </g>
  <!-- Fine negative-space cuts create a crisp, engineered finish -->
  <path d="M257 128 L373 128 C394 128 402 138 397 151 C391 166 379 177 356 177 L247 177" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.22"/>
</svg>
